<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <!-- Google Tag Manager -->
  <script>(function(w,d,s,l,i){w[l]=w[l]||[];w[l].push({'gtm.start':
  new Date().getTime(),event:'gtm.js'});var f=d.getElementsByTagName(s)[0],
  j=d.createElement(s),dl=l!='dataLayer'?'&l='+l:'';j.async=true;j.src=
  'https://www.googletagmanager.com/gtm.js?id='+i+dl;f.parentNode.insertBefore(j,f);
  })(window,document,'script','dataLayer','GTM-NBTV9BQ');</script>
  <!-- End Google Tag Manager -->
  <title>Ford Araç Seçimi</title>
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/vehicle-select.css">
</head>

<body>
  <!-- Google Tag Manager (noscript) -->
  <noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-NBTV9BQ"
  height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript>
  <!-- End Google Tag Manager (noscript) -->
  <div class="page vehicle-select-page">

    <header class="vs-header">
      <h1 class="vs-title">Araç Seçin</h1>
      <p class="vs-subtitle">Tanıtımını görmek istediğiniz aracı seçin</p>
    </header>

    <div class="vs-grid">

      <a href="vehicles/puma.html" class="vs-card">
        <img src="assets/images/puma/anasayfa/hero/anasayfa.png" alt="Ford Puma">
        <div class="vs-card__info">
          <h2>Ford Puma®</h2>
          <p>2.131.600 TL'den başlayan fiyatlarla*</p>
        </div>
      </a>

      <a href="vehicles/explorer.html" class="vs-card">
        <img src="assets/images/explorer/anasayfa/hero/anasayfa.jpg" alt="Yeni Ford Explorer">
        <div class="vs-card__info">
          <h2>Yeni Ford Explorer®</h2>
          <p>2.209.600 TL’den başlayan fiyatlarla*</p>
        </div>
      </a>

      <a href="vehicles/capri.html" class="vs-card">
        <img src="assets/images/capri/anasayfa/hero/anasayfa.jpg" alt="Yeni Ford Capri">
        <div class="vs-card__info">
          <h2>Yeni Ford Capri®</h2>
          <p>2.431.700 TL'den başlayan fiyatlarla*</p>
        </div>
      </a>

      <!--
        YENİ ARAÇ EKLEMEK İÇİN:
        Aşağıdaki şablonu kopyalayıp düzenleyin.

        <a href="vehicles/kuga.html" class="vs-card">
          <img src="assets/images/kuga/anasayfa/hero/anasayfa.png" alt="Ford Kuga">
          <div class="vs-card__info">
            <h2>Ford Kuga®</h2>
            <p>X.XXX.XXX TL'den başlayan fiyatlarla*</p>
          </div>
        </a>
      -->

    </div>

  </div>

  <script>
    document.querySelectorAll('.vs-card').forEach(function(card) {
      card.addEventListener('click', function(e) {
        e.preventDefault();
        var href = this.getAttribute('href');
        var modelName = this.querySelector('h2').innerText.replace('®', '').trim();
        
        window.dataLayer = window.dataLayer || [];
        window.dataLayer.push({
          'event': 'ga4_event',
          'event_name': 'kiosk_arac_secimi',
          'model': modelName
        });
        
        // GTM'in event'i göndermesi için kısa bir süre bekleyip yönlendirme yapıyoruz
        setTimeout(function() {
          window.location.href = href;
        }, 150);
      });
    });
  </script>
</body>
</html>
